name: Keep Streamlit App Alive

on:
  schedule:
    # 매일 한국 시간(KST) 오전 9시와 오후 9시에 실행 (UTC 기준 00:00, 12:00)
    - cron: '0 0,12 * * *'
  # GitHub Actions 탭에서 수동으로 즉시 실행해 볼 수 있도록 설정
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit Streamlit App
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python wake_up.py
